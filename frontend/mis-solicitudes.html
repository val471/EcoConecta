<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis solicitudes · EcoConecta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main class="contenedor">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
      <h1 class="mb-0">Mis solicitudes</h1>
      <a class="btn btn-eco" href="solicitud.html"><i class="bi bi-plus-circle" aria-hidden="true"></i> Solicitar recolección</a>
    </div>

    <div class="eco-card mt-3" id="caja-puntos">
      <div class="d-flex flex-wrap align-items-center gap-3">
        <div><div class="texto-suave">Tus puntos</div><div id="total-puntos"></div></div>
      </div>
      <div class="aviso-puntos mt-2" id="aviso-puntos"></div>
    </div>

    <div id="alertas" class="mt-3" aria-live="polite"></div>
    <div id="lista" class="d-grid gap-3 mt-3" aria-busy="true">
      <div class="texto-suave">Cargando tus solicitudes…</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/mis-solicitudes.js"></script>
</body>
</html>
