<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis recolecciones · EcoConecta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main class="contenedor">
    <h1 class="mb-1">Mis recolecciones</h1>
    <div id="subtitulo" class="texto-suave"></div>
    <div id="alertas" class="mt-3" aria-live="polite"></div>
    <div class="d-flex flex-wrap gap-2 mt-3" id="pestanas" role="group" aria-label="Filtrar recolecciones"></div>
    <div id="lista" class="d-grid gap-3 mt-3" aria-busy="true"><div class="texto-suave">Cargando…</div></div>
  </main>

  <!-- Modal: registrar la recolección (cierre) -->
  <div class="modal fade" id="modal-recoger" tabindex="-1" aria-labelledby="t-recoger" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h4" id="t-recoger">¿Ya recogiste?</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
      <div class="modal-body">
        <div id="alerta-recoger"></div>
        <p id="resumen-recoger" class="mb-3"></p>
        <label class="form-label" for="tipo">¿Qué recogiste?</label>
        <select id="tipo" class="form-select"></select>
        <label class="form-label mt-3" for="cantidad">¿Cuántos kilos? (kg)</label>
        <input id="cantidad" class="form-control" inputmode="decimal" autocomplete="off" placeholder="Ej.: 2 o 2,5">
        <div class="ayuda mt-2" id="vista-registro"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-eco" data-bs-dismiss="modal">Todavía no</button>
        <button class="btn btn-eco" id="btn-recoger" disabled><i class="bi bi-check-circle" aria-hidden="true"></i> Sí, ya recogí</button>
      </div>
    </div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/recolector.js"></script>
</body>
</html>
