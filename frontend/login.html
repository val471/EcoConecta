<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingresar · EcoConecta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>
  <main class="contenedor" style="max-width:480px">
    <h1 class="mb-3">Ingresar</h1>
    <div id="alertas"></div>
    <form id="form-login" class="eco-card">
      <label class="form-label" for="email">Celular o correo</label>
      <input id="email" type="text" inputmode="email" class="form-control mb-3" required autocomplete="username">
      <label class="form-label" for="password">Contraseña</label>
      <input id="password" type="password" class="form-control mb-3" required autocomplete="current-password">
      <button class="btn btn-eco w-100" type="submit">Ingresar</button>
    </form>
    <p class="mt-3 fs-5">¿No tienes cuenta? <a href="registro.html"><strong>Crear mi cuenta</strong></a></p>

    <div class="eco-card mt-4" id="demo">
      <div class="titulo mb-2">Usuarios de prueba (contraseña: demo123)</div>
      <div class="d-grid gap-2" id="botones-demo"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script>
    renderNavbar();

    const DEMOS = [
      ["ana@demo.co", "Negocio (solicitante)"], ["luis@demo.co", "Hogar (solicitante)"],
      ["coordh@demo.co", "Coordinador de huerteros"], ["coordr@demo.co", "Coordinador de recicladores"],
      ["huertero@demo.co", "Huertero"], ["reciclador@demo.co", "Reciclador"], ["admin@demo.co", "Administrador"], ["vecina@demo.co", "Hogar sin habilitar (piloto)"],
    ];
    const cont = document.getElementById("botones-demo");
    if (!USAR_MOCK) document.getElementById("demo").remove(); // quitar al pasar a producción
    else DEMOS.forEach(([correo, texto]) => {
      const b = document.createElement("button");
      b.className = "btn btn-outline-eco text-start"; b.textContent = texto;
      b.onclick = () => iniciarSesion(correo, "demo123").catch((e) => mostrarAlerta(e.message, "danger"));
      cont.appendChild(b);
    });

    document.getElementById("form-login").addEventListener("submit", (e) => {
      e.preventDefault();
      iniciarSesion(email.value, password.value).catch((err) => mostrarAlerta(err.message, "danger"));
    });
  </script>
</body>
</html>
