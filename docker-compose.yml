services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ecoconecta
      POSTGRES_PASSWORD: ecoconecta_local   # solo para desarrollo local
      POSTGRES_DB: ecoconecta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecoconecta"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ecoconecta:ecoconecta_local@db:5432/ecoconecta
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: