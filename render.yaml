# Blueprint de Render: crea el Web Service (Docker) y la base PostgreSQL
services:
  - type: web
    name: ecoconecta
    runtime: docker
    plan: free
    healthCheckPath: /api/salud
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecoconecta-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false          # se escribe a mano en el panel de Render
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: ecoconecta-db
    plan: free